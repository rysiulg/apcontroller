name: Build OpenWrt APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.4"
  TARGET: "mediatek"
  SUBTARGET: "filogic"
  ARCH: "aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # KEY
      # Generujemy tylko jeśli BRAKUJE PUBLICZNEGO klucza.
      # ============================================================

      - name: Prepare signing key
        run: |
          mkdir -p keys

          if [ -f keys/apcontroller.rsa.pub ]; then
            echo "Public key exists - keeping existing key"
          else
            echo "Public key missing - generating new RSA key pair"

            docker run --rm \
              -v "$PWD/keys:/keys" \
              alpine:latest \
              sh -c '
                apk add --no-cache abuild

                mkdir -p /tmp/abuild/.abuild
                export HOME=/tmp/abuild

                abuild-keygen -n -q

                cp /tmp/abuild/.abuild/*.rsa /keys/apcontroller.rsa
                cp /tmp/abuild/.abuild/*.rsa.pub /keys/apcontroller.rsa.pub
              '

            chmod 600 keys/apcontroller.rsa

            echo "Generated:"
            ls -lah keys
          fi

      # ============================================================
      # CHECK APK
      # ============================================================

      - name: Check existing APKs
        id: check
        run: |
          mkdir -p feed/${ARCH}

          AP=$(find feed/${ARCH} \
            -maxdepth 1 \
            -type f \
            -name 'apcontroller-*.apk' \
            | head -1)

          LUCI=$(find feed/${ARCH} \
            -maxdepth 1 \
            -type f \
            -name 'luci-app-apcontroller-*.apk' \
            | head -1)

          if [ -n "$AP" ] && [ -n "$LUCI" ]; then
            echo "Existing packages found:"
            echo "  $AP"
            echo "  $LUCI"

            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Packages missing - SDK build required"

            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # SDK
      # Pobieramy TYLKO gdy trzeba budować APK.
      # ============================================================

      - name: Download OpenWrt SDK
        if: steps.check.outputs.build == 'true'
        run: |
          wget -q \
            https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}_gcc-14.3.0_musl.Linux-x86_64.tar.zst

      - name: Extract SDK
        if: steps.check.outputs.build == 'true'
        run: |
          tar --zstd -xf openwrt-sdk-*.tar.zst

          echo "SDK=$(find "$PWD" \
            -maxdepth 1 \
            -type d \
            -name 'openwrt-sdk-*' \
            | head -1)" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Copy packages
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p "$SDK/package/apcontroller"
          mkdir -p "$SDK/package/luci-app-apcontroller"

          cp -a apcontroller/. \
            "$SDK/package/apcontroller/"

          cp -a luci-app-apcontroller/. \
            "$SDK/package/luci-app-apcontroller/"

      - name: Update feeds
        if: steps.check.outputs.build == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        if: steps.check.outputs.build == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          make defconfig

      - name: Build apcontroller
        if: steps.check.outputs.build == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          make package/apcontroller/compile V=s

      - name: Build luci-app-apcontroller
        if: steps.check.outputs.build == 'true'
        working-directory: ${{ env.SDK }}
        run: |
          make package/luci-app-apcontroller/compile V=s

      # ============================================================
      # COLLECT
      # ============================================================

      - name: Collect APKs
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p feed/${ARCH}

          find "$SDK/bin/packages" \
            -type f \
            -name '*.apk' \
            \( \
              -name 'apcontroller-*.apk' \
              -o \
              -name 'luci-app-apcontroller-*.apk' \
            \) \
            -exec cp {} feed/${ARCH}/ \;

          ls -lah feed/${ARCH}

      # ============================================================
      # INDEX
      #
      # Alpine dostarcza apk-tools.
      # Nie potrzebujemy SDK tylko po to, żeby zrobić packages.adb.
      # ============================================================

      - name: Generate APK repository index
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            alpine:latest \
            sh -c '
              apk add --no-cache apk-tools

              cd /work/feed/${ARCH}

              apk mkndx \
                --root . \
                --keys-dir ../../keys \
                --allow-untrusted \
                --sign-key ../../keys/apcontroller.rsa \
                --output packages.adb \
                *.apk

              ls -lah
            '
        env:
          ARCH: ${{ env.ARCH }}

      # ============================================================
      # PUBLISH
      # ============================================================

      - name: Commit and push feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed/${ARCH} keys/apcontroller.rsa.pub

          # PRYWATNEGO KLUCZA NIE COMMITUJEMY
          git reset keys/apcontroller.rsa 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi

          git commit -m "Update OpenWrt APK feed"

          git pull --rebase origin main

          git push origin HEAD:main
