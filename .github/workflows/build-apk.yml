name: Build OpenWrt APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Nie pozwalaj na równoległe przebudowywanie tego samego feeda.
concurrency:
  group: apcontroller-apk-feed
  cancel-in-progress: false

env:
  OPENWRT_VERSION: "25.12.4"
  TARGET: "mediatek"
  SUBTARGET: "filogic"
  ARCH: "aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # APK SIGNING KEY
      #
      # Jeżeli publiczny klucz nie istnieje:
      #   -> generujemy nową parę secp256r1
      #
      # Jeżeli publiczny istnieje:
      #   -> używamy istniejącej pary
      #
      # Jeżeli publiczny istnieje, ale prywatnego nie ma:
      #   -> błąd
      # ============================================================
      - name: Prepare APK signing key
        run: |
          set -e

          mkdir -p keys

          if [ ! -s keys/apcontroller.rsa.pub ]; then
            echo "Public key does not exist."
            echo "Generating new secp256r1 APK signing key..."

            openssl ecparam \
              -name prime256v1 \
              -genkey \
              -noout \
              -out keys/apcontroller.rsa

            openssl ec \
              -in keys/apcontroller.rsa \
              -pubout \
              -out keys/apcontroller.rsa.pub

            chmod 600 keys/apcontroller.rsa

            echo "New APK signing key generated."

          else
            echo "Public key already exists."

            if [ ! -s keys/apcontroller.rsa ]; then
              echo "ERROR: public key exists but private key is missing."
              exit 1
            fi

            echo "Using existing APK signing key."
          fi

          echo
          echo "APK keys:"
          ls -lah keys/

      # ============================================================
      # FETCH CURRENT MAIN
      # ============================================================
      - name: Fetch current main
        run: |
          set -e

          git fetch origin main

          echo
          echo "Current origin/main:"
          git rev-parse origin/main

      # ============================================================
      # DOWNLOAD OPENWRT SDK
      # ============================================================
      - name: Download OpenWrt SDK
        run: |
          set -e

          wget -q \
            "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

      # ============================================================
      # EXTRACT SDK
      # ============================================================
      - name: Extract SDK
        run: |
          set -e

          tar --zstd -xf openwrt-sdk-*.tar.zst

          SDK="$(find "$PWD" \
            -maxdepth 1 \
            -type d \
            -name 'openwrt-sdk-*' \
            | head -1)"

          if [ -z "$SDK" ]; then
            echo "ERROR: OpenWrt SDK not found"
            exit 1
          fi

          echo "SDK=$SDK" >> "$GITHUB_ENV"

          echo "SDK: $SDK"

      # ============================================================
      # COPY PACKAGES
      # ============================================================
      - name: Copy packages
        run: |
          set -e

          mkdir -p "$SDK/package/apcontroller"
          mkdir -p "$SDK/package/luci-app-apcontroller"

          cp -a \
            apcontroller/. \
            "$SDK/package/apcontroller/"

          cp -a \
            luci-app-apcontroller/. \
            "$SDK/package/luci-app-apcontroller/"

      # ============================================================
      # DETERMINE NEXT PACKAGE REVISION
      #
      # Obsługiwane nazwy:
      #
      #   apcontroller-1.0-r1.apk
      #   apcontroller-1.0-r1_aarch64_cortex-a53.apk
      #   apcontroller-1.0-r12_aarch64_cortex-a53.apk
      #
      # Szukamy najwyższego rX w origin/main.
      #
      # Jeżeli jest:
      #
      #   r1 -> r2
      #   r2 -> r3
      #   r3 -> r4
      #
      # itd.
      # ============================================================
      - name: Determine package revision
        run: |
          set -e

          get_latest_revision() {
            local PACKAGE="$1"
            local MAX=0
            local FILE
            local BASE
            local REV

            echo
            echo "============================================================"
            echo "Searching revision for: ${PACKAGE}"
            echo "============================================================"

            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue

              BASE="$(basename "$FILE")"

              # Obsługuje:
              #
              # package-1.0-r1.apk
              # package-1.0-r1_aarch64_cortex-a53.apk
              # package-1.0-r12_aarch64_cortex-a53.apk
              #
              REV="$(printf '%s\n' "$BASE" | \
                sed -nE 's/.*-r([0-9]+)(_.*)?\.apk$/\1/p')"

              if [ -n "$REV" ]; then
                echo "Found: $BASE -> r${REV}"

                if [ "$REV" -gt "$MAX" ]; then
                  MAX="$REV"
                fi
              else
                echo "WARNING: Could not determine revision from:"
                echo "         $BASE"
              fi

            done < <(
              git ls-tree -r --name-only origin/main -- \
                "feed/${ARCH}/${PACKAGE}-*.apk"
            )

            echo
            echo "Highest revision for ${PACKAGE}: r${MAX}"

            echo "$MAX"
          }

          # ----------------------------------------------------------
          # UWAGA:
          # funkcja wypisuje logi, dlatego bierzemy tylko ostatnią
          # linię jako wynik liczbowy.
          # ----------------------------------------------------------

          AP_REV="$(
            get_latest_revision apcontroller | tail -n 1
          )"

          LUCI_REV="$(
            get_latest_revision luci-app-apcontroller | tail -n 1
          )"

          # ----------------------------------------------------------
          # Walidacja
          # ----------------------------------------------------------

          if ! [[ "$AP_REV" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid apcontroller revision: '$AP_REV'"
            exit 1
          fi

          if ! [[ "$LUCI_REV" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid luci-app-apcontroller revision: '$LUCI_REV'"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "CURRENT REVISIONS"
          echo "============================================================"

          echo "apcontroller:          r${AP_REV}"
          echo "luci-app-apcontroller: r${LUCI_REV}"

          # ----------------------------------------------------------
          # NEXT REVISION
          # ----------------------------------------------------------

          AP_NEW=$((AP_REV + 1))
          LUCI_NEW=$((LUCI_REV + 1))

          echo
          echo "============================================================"
          echo "NEW REVISIONS"
          echo "============================================================"

          echo "apcontroller:          r${AP_NEW}"
          echo "luci-app-apcontroller: r${LUCI_NEW}"

          # ----------------------------------------------------------
          # MAKEFILES
          # ----------------------------------------------------------

          AP_MAKEFILE="$SDK/package/apcontroller/Makefile"
          LUCI_MAKEFILE="$SDK/package/luci-app-apcontroller/Makefile"

          if [ ! -f "$AP_MAKEFILE" ]; then
            echo "ERROR: Missing Makefile:"
            echo "$AP_MAKEFILE"
            exit 1
          fi

          if [ ! -f "$LUCI_MAKEFILE" ]; then
            echo "ERROR: Missing Makefile:"
            echo "$LUCI_MAKEFILE"
            exit 1
          fi

          # ----------------------------------------------------------
          # APController
          # ----------------------------------------------------------

          if grep -q '^[[:space:]]*PKG_RELEASE:=' "$AP_MAKEFILE"; then

            sed -i \
              "s/^[[:space:]]*PKG_RELEASE:=.*/PKG_RELEASE:=${AP_NEW}/" \
              "$AP_MAKEFILE"

          else

            sed -i \
              "/^[[:space:]]*PKG_VERSION:=/a PKG_RELEASE:=${AP_NEW}" \
              "$AP_MAKEFILE"

          fi

          # ----------------------------------------------------------
          # LuCI application
          # ----------------------------------------------------------

          if grep -q '^[[:space:]]*PKG_RELEASE:=' "$LUCI_MAKEFILE"; then

            sed -i \
              "s/^[[:space:]]*PKG_RELEASE:=.*/PKG_RELEASE:=${LUCI_NEW}/" \
              "$LUCI_MAKEFILE"

          else

            sed -i \
              "/^[[:space:]]*PKG_VERSION:=/a PKG_RELEASE:=${LUCI_NEW}" \
              "$LUCI_MAKEFILE"

          fi

          # ----------------------------------------------------------
          # SHOW RESULT
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo "MODIFIED MAKEFILES"
          echo "============================================================"

          echo
          echo "--- apcontroller/Makefile ---"
          grep -E '^[[:space:]]*PKG_(VERSION|RELEASE):=' \
            "$AP_MAKEFILE" || true

          echo
          echo "--- luci-app-apcontroller/Makefile ---"
          grep -E '^[[:space:]]*PKG_(VERSION|RELEASE):=' \
            "$LUCI_MAKEFILE" || true

          # Zachowujemy wartości dla kolejnych kroków.
          echo "AP_NEW=${AP_NEW}" >> "$GITHUB_ENV"
          echo "LUCI_NEW=${LUCI_NEW}" >> "$GITHUB_ENV"

      # ============================================================
      # UPDATE FEEDS
      # ============================================================
      - name: Update feeds
        working-directory: ${{ env.SDK }}
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # CONFIGURE SDK
      # ============================================================
      - name: Configure
        working-directory: ${{ env.SDK }}
        run: |
          set -e

          make defconfig

      # ============================================================
      # BUILD APController
      # ============================================================
      - name: Build apcontroller
        working-directory: ${{ env.SDK }}
        run: |
          set -e

          echo "Building apcontroller r${AP_NEW}..."

          make package/apcontroller/compile V=s

      # ============================================================
      # BUILD LUCI APP
      # ============================================================
      - name: Build luci-app-apcontroller
        working-directory: ${{ env.SDK }}
        run: |
          set -e

          echo "Building luci-app-apcontroller r${LUCI_NEW}..."

          make package/luci-app-apcontroller/compile V=s

      # ============================================================
      # BUILD HOST APK-TOOLS
      # ============================================================
      - name: Build host apk-tools
        working-directory: ${{ env.SDK }}
        run: |
          set -e

          make package/apk/host/compile V=s

      # ============================================================
      # FIND APK TOOL
      # ============================================================
      - name: Find apk
        run: |
          set -e

          APK="$(find "$SDK" \
            -type f \
            -name apk \
            -path '*/staging_dir/host/*' \
            -perm -111 \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: apk tool was not found."

            echo
            echo "Searching entire SDK:"
            find "$SDK" -type f -name apk -print || true

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Using APK:"
          echo "$APK"

      # ============================================================
      # COLLECT ONLY OUR APKs
      #
      # Stare APK są usuwane.
      # Feed zawiera tylko aktualny build.
      # ============================================================
      - name: Collect APKs
        run: |
          set -e

          rm -rf "feed/${ARCH}"
          mkdir -p "feed/${ARCH}"

          find "$SDK/bin/packages" \
            -type f \
            -name '*.apk' \
            \( \
              -name 'apcontroller-*.apk' \
              -o \
              -name 'luci-app-apcontroller-*.apk' \
            \) \
            -exec cp -f {} "feed/${ARCH}/" \;

          echo
          echo "============================================================"
          echo "COLLECTED APKs"
          echo "============================================================"

          ls -lah "feed/${ARCH}"

          COUNT="$(
            find "feed/${ARCH}" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              | wc -l
          )"

          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: Expected at least 2 APKs, found $COUNT"
            exit 1
          fi

          # ----------------------------------------------------------
          # Dodatkowa kontrola PKG_RELEASE.
          #
          # Sprawdzamy, czy wygenerowane nazwy faktycznie zawierają
          # oczekiwane rX.
          # ----------------------------------------------------------

          echo
          echo "Checking generated revisions..."

          AP_FILE="$(
            find "feed/${ARCH}" \
              -maxdepth 1 \
              -type f \
              -name 'apcontroller-*.apk' \
              | head -1
          )"

          LUCI_FILE="$(
            find "feed/${ARCH}" \
              -maxdepth 1 \
              -type f \
              -name 'luci-app-apcontroller-*.apk' \
              | head -1
          )"

          if [ -z "$AP_FILE" ]; then
            echo "ERROR: apcontroller APK not found."
            exit 1
          fi

          if [ -z "$LUCI_FILE" ]; then
            echo "ERROR: luci-app-apcontroller APK not found."
            exit 1
          fi

          AP_BASE="$(basename "$AP_FILE")"
          LUCI_BASE="$(basename "$LUCI_FILE")"

          AP_BUILT_REV="$(
            printf '%s\n' "$AP_BASE" |
              sed -nE 's/.*-r([0-9]+)(_.*)?\.apk$/\1/p'
          )"

          LUCI_BUILT_REV="$(
            printf '%s\n' "$LUCI_BASE" |
              sed -nE 's/.*-r([0-9]+)(_.*)?\.apk$/\1/p'
          )"

          echo "apcontroller APK:"
          echo "  $AP_BASE"
          echo "  detected revision: r${AP_BUILT_REV}"
          echo "  expected revision: r${AP_NEW}"

          echo
          echo "luci-app-apcontroller APK:"
          echo "  $LUCI_BASE"
          echo "  detected revision: r${LUCI_BUILT_REV}"
          echo "  expected revision: r${LUCI_NEW}"

          if [ "$AP_BUILT_REV" != "$AP_NEW" ]; then
            echo
            echo "ERROR: apcontroller revision mismatch!"
            exit 1
          fi

          if [ "$LUCI_BUILT_REV" != "$LUCI_NEW" ]; then
            echo
            echo "ERROR: luci-app-apcontroller revision mismatch!"
            exit 1
          fi

          echo
          echo "Revision check OK."

      # ============================================================
      # GENERATE APK REPOSITORY INDEX
      # ============================================================
      - name: Generate APK repository index
        run: |
          set -e

          cd "feed/${ARCH}"

          rm -f packages.adb

          echo "Generating packages.adb..."

          "$APK" mkndx \
            --root . \
            --keys-dir ../../keys \
            --allow-untrusted \
            --sign ../../keys/apcontroller.rsa \
            --output packages.adb \
            *.apk

          echo
          echo "Generated feed:"
          ls -lah

      # ============================================================
      # SAVE FRESH FEED
      #
      # Musimy zachować go poza repo, ponieważ za chwilę
      # resetujemy checkout do aktualnego origin/main.
      # ============================================================
      - name: Save generated feed
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apcontroller-feed"
          mkdir -p "$RUNNER_TEMP/apcontroller-feed"

          cp -a \
            "feed/${ARCH}/." \
            "$RUNNER_TEMP/apcontroller-feed/"

          echo "Saved generated feed:"
          ls -lah "$RUNNER_TEMP/apcontroller-feed"

      # ============================================================
      # COMMIT + PUSH
      #
      # NIE MA REBASE.
      #
      # 1. Pobieramy najnowszy main.
      # 2. Resetujemy checkout do origin/main.
      # 3. Wstawiamy świeży feed.
      # 4. Wstawiamy klucze.
      # 5. Commit.
      # 6. Push.
      # ============================================================
      - name: Commit and push feed
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do

            echo
            echo "============================================================"
            echo "Push attempt ${ATTEMPT}/5"
            echo "============================================================"

            # --------------------------------------------------------
            # Pobierz najnowszy main.
            # --------------------------------------------------------

            git fetch origin main

            echo "origin/main:"
            git rev-parse origin/main

            # --------------------------------------------------------
            # Ustaw checkout dokładnie na aktualnym main.
            # --------------------------------------------------------

            git reset --hard origin/main

            # --------------------------------------------------------
            # Wstaw świeży feed z tego builda.
            # --------------------------------------------------------

            rm -rf "feed/${ARCH}"
            mkdir -p "feed/${ARCH}"

            cp -a \
              "$RUNNER_TEMP/apcontroller-feed/." \
              "feed/${ARCH}/"

            # --------------------------------------------------------
            # Klucze.
            # --------------------------------------------------------

            mkdir -p keys

            if [ -f keys/apcontroller.rsa ] && \
               [ -f keys/apcontroller.rsa.pub ]; then

              echo "Signing keys present."

            else

              echo "ERROR: signing keys disappeared after reset"
              exit 1

            fi

            # --------------------------------------------------------
            # Git status.
            # --------------------------------------------------------

            echo
            echo "Git status:"
            git status --short

            git add \
              "feed/${ARCH}" \
              keys/apcontroller.rsa \
              keys/apcontroller.rsa.pub

            # --------------------------------------------------------
            # Czy coś się zmieniło?
            # --------------------------------------------------------

            if git diff --cached --quiet; then
              echo
              echo "No changes to commit."
              exit 0
            fi

            # --------------------------------------------------------
            # Commit.
            # --------------------------------------------------------

            git commit \
              -m "Build OpenWrt ${OPENWRT_VERSION} APK feed"

            # --------------------------------------------------------
            # Push.
            # --------------------------------------------------------

            if git push origin HEAD:main; then

              echo
              echo "============================================================"
              echo "Feed pushed successfully."
              echo "============================================================"

              exit 0
            fi

            # --------------------------------------------------------
            # Ktoś zmienił main.
            # --------------------------------------------------------

            echo
            echo "Push failed because origin/main changed."
            echo "Fetching latest main and retrying..."

            git reset --hard origin/main

            sleep 2

          done

          echo
          echo "ERROR: Could not push feed after 5 attempts."
          exit 1
