name: Build OpenWrt APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.4"
  TARGET: "mediatek"
  SUBTARGET: "filogic"
  ARCH: "aarch64_cortex-a53"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Klucz APK
      #
      # Jeżeli publiczny nie istnieje -> generujemy parę.
      # Jeżeli publiczny istnieje -> używamy istniejącej pary.
      # Jeżeli publiczny istnieje, ale prywatnego brakuje -> błąd.
      # ------------------------------------------------------------
      - name: Prepare APK signing key
        run: |
          mkdir -p keys

          if [ ! -f keys/apcontroller.rsa.pub ]; then
            echo "Public key does not exist - generating new key pair"

            openssl genrsa \
              -out keys/apcontroller.rsa \
              2048

            openssl rsa \
              -in keys/apcontroller.rsa \
              -pubout \
              -out keys/apcontroller.rsa.pub

            chmod 600 keys/apcontroller.rsa

          else
            echo "Public key already exists"

            if [ ! -f keys/apcontroller.rsa ]; then
              echo "ERROR: public key exists but private key is missing"
              exit 1
            fi
          fi

          echo "Keys:"
          ls -l keys/

      # ------------------------------------------------------------
      # SDK
      # ------------------------------------------------------------
      - name: Download OpenWrt SDK
        run: |
          wget -q \
            "https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

      - name: Extract SDK
        run: |
          tar --zstd -xf openwrt-sdk-*.tar.zst

          SDK="$(find "$PWD" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)"

          echo "SDK=$SDK" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Pakiety
      # ------------------------------------------------------------
      - name: Copy packages
        run: |
          mkdir -p "$SDK/package/apcontroller"
          mkdir -p "$SDK/package/luci-app-apcontroller"

          cp -a apcontroller/. \
            "$SDK/package/apcontroller/"

          cp -a luci-app-apcontroller/. \
            "$SDK/package/luci-app-apcontroller/"

      # ------------------------------------------------------------
      # Revision
      #
      # Bierzemy obecne PKG_RELEASE z Makefile i zwiększamy o 1.
      #
      # Np.
      #   r1 -> r2
      #   r2 -> r3
      #
      # Dzięki temu apk upgrade zobaczy nową wersję.
      # ------------------------------------------------------------
      - name: Increase package revision
        run: |
          for PKG in apcontroller luci-app-apcontroller; do
            MAKEFILE="$SDK/package/$PKG/Makefile"

            echo "Processing $MAKEFILE"

            CURRENT=$(sed -n 's/^[[:space:]]*PKG_RELEASE:=//p' "$MAKEFILE" | head -1)

            if [ -z "$CURRENT" ]; then
              CURRENT=1
            fi

            NEW=$((CURRENT + 1))

            sed -i \
              "s/^[[:space:]]*PKG_RELEASE:=.*/PKG_RELEASE:=$NEW/" \
              "$MAKEFILE"

            echo "$PKG: r$CURRENT -> r$NEW"

            grep -E 'PKG_VERSION|PKG_RELEASE' "$MAKEFILE" | head
          done

      # ------------------------------------------------------------
      # Feeds potrzebne przez pakiety
      # ------------------------------------------------------------
      - name: Update feeds
        working-directory: ${{ env.SDK }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ------------------------------------------------------------
      # Konfiguracja SDK
      # ------------------------------------------------------------
      - name: Configure
        working-directory: ${{ env.SDK }}
        run: |
          make defconfig

      # ------------------------------------------------------------
      # Build tylko naszych pakietów
      # ------------------------------------------------------------
      - name: Build apcontroller
        working-directory: ${{ env.SDK }}
        run: |
          make package/apcontroller/compile V=s

      - name: Build luci-app-apcontroller
        working-directory: ${{ env.SDK }}
        run: |
          make package/luci-app-apcontroller/compile V=s

      # ------------------------------------------------------------
      # APK
      #
      # SDK nie musi mieć apk w staging_dir/host/bin.
      # Budujemy apk-tools host z SDK.
      # ------------------------------------------------------------
      - name: Build host apk-tools
        working-directory: ${{ env.SDK }}
        run: |
          make package/apk/host/compile V=s

      - name: Collect APKs
        run: |
          mkdir -p "feed/${ARCH}"

          # Nie zostawiaj starych wersji APK.
          rm -f "feed/${ARCH}"/*.apk
          rm -f "feed/${ARCH}/packages.adb"

          find "$SDK/bin/packages" \
            -type f \
            -name '*.apk' \
            \( \
              -name 'apcontroller-*.apk' \
              -o \
              -name 'luci-app-apcontroller-*.apk' \
            \) \
            -exec cp -f {} "feed/${ARCH}/" \;

          echo "Collected packages:"
          ls -lah "feed/${ARCH}"

      # ------------------------------------------------------------
      # Znajdź apk z SDK
      # ------------------------------------------------------------
      - name: Find apk
        run: |
          APK="$(find "$SDK" \
            -type f \
            -name apk \
            -path '*/staging_dir/host/*' \
            -perm -111 \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: apk tool was not built"
            find "$SDK" -type f -name apk -print
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Using APK: $APK"

      # ------------------------------------------------------------
      # Index + podpis
      # ------------------------------------------------------------
      - name: Generate APK repository index
        run: |
          cd "feed/${ARCH}"

          rm -f packages.adb

          "$APK" mkndx \
            --root . \
            --keys-dir ../../keys \
            --allow-untrusted \
            --sign ../../keys/apcontroller.rsa \
            --output packages.adb \
            *.apk

          echo
          echo "Feed:"
          ls -lah

      # ------------------------------------------------------------
      # Commit
      # ------------------------------------------------------------
      - name: Commit feed and keys
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            feed/${ARCH} \
            keys/apcontroller.rsa \
            keys/apcontroller.rsa.pub

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Build OpenWrt ${OPENWRT_VERSION} APK feed"

      # ------------------------------------------------------------
      # Push
      #
      # Nie robimy rebase na binarnym packages.adb.
      #
      # Pobieramy aktualny main i odtwarzamy nasz commit na jego
      # aktualnym stanie, a packages.adb generujemy ponownie.
      # ------------------------------------------------------------
      - name: Push feed
        run: |
          git fetch origin main

          git rebase origin/main || {
            echo "Rebase conflict detected"
            git rebase --abort
            exit 1
          }

          git push origin HEAD:main
